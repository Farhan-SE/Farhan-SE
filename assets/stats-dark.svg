<svg xmlns="http://www.w3.org/2000/svg" width="840" height="244" viewBox="0 0 840 244" role="img" aria-label="GitHub stats for Farhan-SE">
<title>GitHub stats for Farhan-SE</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3;font-variant-numeric:tabular-nums}
.h{font-size:18px;font-weight:650}
.handle{font-size:13px;font-weight:400;fill:#8b949e}
.label{font-size:10.5px;fill:#8b949e;font-weight:600;letter-spacing:.09em}
.value{font-size:34px;font-weight:700;letter-spacing:-.02em}
.unit{font-size:15px;font-weight:600;fill:#8b949e;letter-spacing:0}
.sub{font-size:12px;fill:#8b949e}
.lang{font-size:12px;fill:#e6edf3}
.pct{fill:#8b949e}
.col{opacity:0;animation:up .55s cubic-bezier(.22,1,.36,1) forwards}
.bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow .7s cubic-bezier(.22,1,.36,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes grow{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.col,.bar{animation:none;opacity:1;transform:none}}
</style>
