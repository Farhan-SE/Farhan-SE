name: Profile stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/stats.py, .github/workflows/stats.yml]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: env.STATS_TOKEN != ''
        with:
          python-version: "3.12"

      - name: Stats card
        if: env.STATS_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/stats.py assets

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.STATS_TOKEN || github.token }}
          outputs: |
            assets/snake-light.svg?color_snake=#1f6fe5&color_dots=#ebeff4,#bcd6ff,#7cb0ff,#2b7fff,#0b4fc2
            assets/snake-dark.svg?palette=github-dark&color_snake=#7cb4ff&color_dots=#161b22,#0f3a7a,#1858c4,#2b7fff,#7cb4ff

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: refresh profile stats"
          git push
